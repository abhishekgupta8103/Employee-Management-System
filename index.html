<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

    <header>
        <h1>Employee Management System</h1>

        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Employee Management</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="#">Home</a>
            <a class="nav-link" href="#">Employees</a>
            <a class="nav-link" href="#">About</a>
            <a class="nav-link" href="#">Contact</a>
        </div>
    </div>
</nav>
    </header>

    <h2 id="employee-heading">Employee Information</h2>

    <main>

    <section>
    <h2>Add Employee</h2>

    <form id="employeeForm">

        <div class="mb-3">
            <label for="employeeName" class="form-label">
                Employee Name
            </label>

            <input
                type="text"
                id="employeeName"
                class="form-control"
                placeholder="Enter employee name"
                required
            >
        </div>

        <div class="mb-3">
            <label for="employeeEmail" class="form-label">
                Email
            </label>

            <input
                type="email"
                id="employeeEmail"
                class="form-control"
                placeholder="Enter email"
                required
            >
        </div>

        <div class="mb-3">
            <label for="employeeRole" class="form-label">
                Role
            </label>

            <input
                type="text"
                id="employeeRole"
                class="form-control"
                placeholder="Enter role"
                required
            >
        </div>


    </form>
    <section>
    <h2>Employees from API</h2>

    <div id="apiEmployees" class="row g-4"></div>

</section>

</section>

    <aside>
        <h3>Quick Links</h3>
        <p>View employees and manage records.</p>
        
    </aside>
    <section>
    <h2>My To-Do List</h2>

    <div class="input-group mb-3">
        <input
            type="text"
            id="taskInput"
            class="form-control"
            placeholder="Enter your task"
        >

        <button
            id="addTaskBtn"
            class="btn btn-primary"
        >
            Add Task
        </button>
    </div>

    <ul id="taskList" class="list-group"></ul>
</section>

</main>

    <footer>
        <p>&copy; 2026 Employee Management System</p>
    </footer>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
<script src="script.js"></script>
</body>
</html>
